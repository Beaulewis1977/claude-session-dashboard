appId: com.beaulewis.claude-session-dashboard
productName: Claude Session Dashboard
copyright: Copyright © 2026 Beau Lewis
directories:
  output: release/${version}
  buildResources: resources
# Only the built app goes into app.asar (scripts/check-asar.cjs fails the build
# if anything else ends up in it, e.g. a stray file left in out/).
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - resources/icon.png
  - resources/bridge/**
  - package.json
  - '!**/*.map'
afterPack: scripts/check-asar.cjs
npmRebuild: false
# The app is in English: only Electron's en-US locale ships (Chromium falls
# back to it for every other system language).
electronLanguages:
  - en-US
compression: maximum
# Electron features the app doesn't use are switched off in the packaged app,
# and it only runs its own, integrity-checked app.asar
# (https://www.electronjs.org/docs/latest/tutorial/fuses).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
extraFiles:
  - from: THIRD_PARTY_NOTICES
    to: THIRD_PARTY_NOTICES.txt
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Claude Session Dashboard
  artifactName: ClaudeSessionDashboard-Setup-${version}.${ext}
portable:
  artifactName: ClaudeSessionDashboard-Portable-${version}.${ext}
